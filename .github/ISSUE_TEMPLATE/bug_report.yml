name: Bug Report
description: Create a report to help us improve Pixel Calculator Mod
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please check existing issues before submitting.
  - type: input
    id: device
    attributes:
      label: Device Model
      description: What device are you using?
      placeholder: e.g. Samsung Galaxy S23, OnePlus 11, Xiaomi 13
    validations:
      required: true
  - type: input
    id: os_version
    attributes:
      label: Android Version & ROM
      description: Which Android version and custom skin/ROM are you running?
      placeholder: e.g. Android 14 (One UI 6.1) / LineageOS 21
    validations:
      required: true
  - type: dropdown
    id: installation_method
    attributes:
      label: Installation Method
      options:
        - Standalone Pre-built APK (Release)
        - Morphe Manager (.mpp)
        - Compiled from source (build.sh / pipeline.sh)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem Description
      description: A clear description of what happened vs what was expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can someone reproduce this behavior?
      value: |
        1. Open 'Pixel Calculator'
        2. Tap on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: logcat
    attributes:
      label: Relevant Logcat / Stack Trace
      description: Please paste any logcat output or error logs (adb logcat -d).
      render: shell
